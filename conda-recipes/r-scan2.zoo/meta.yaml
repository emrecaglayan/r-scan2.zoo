package:
  name: r-scan2.zoo
  version: '0.1'

source:
  git_url: https://github.com/emrecaglayan/r-scan2.zoo

build:
  merge_build_host: True  # [win]
  # If this is a new build for the same version, increment the build number.
  number: 0
  # This is required to make R link correctly on Linux.
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}        # [not win]
    - {{ compiler('cxx') }}      # [not win]
    - toolchain        # [win]
    - filesystem        # [win]
    - make
    - sed               # [win]
    - coreutils         # [win]
    - zip               # [win]
  host:
    - r-base >=4.2
    - openblas
    - htslib >=1.9
    - r-plyr
    - r-fastghquad
    - r-yaml
    - r-pracma
    - r-data.table
    - r-RhpcBLASctl
    - r-progressr
    - r-future
    - r-future.apply
    - r-qs
    - r-bedtoolsr
    - r-r.utils
    - r-digest
    - r-viridis
    - r-viridisLite
    - bioconductor-bsgenome
    - bioconductor-genomicranges
    - bioconductor-genomeinfodb
    - bioconductor-rsamtools
    - bioconductor-bsgenome.hsapiens.1000genomes.hs37d5
    - bioconductor-bsgenome.hsapiens.UCSC.hg38
    - bioconductor-bsgenome.mmusculus.UCSC.mm10
    - bioconductor-bsgenome.mmulatta.UCSC.rheMac10
    - bioconductor-bsgenome.ptroglodytes.UCSC.panTro6
    - bioconductor-bsgenome.mfuro.UCSC.musFur1

  run:
    - r-base >=4.2
    - openblas
    - htslib >=1.9
    - r-plyr
    - r-fastghquad
    - r-yaml
    - r-pracma
    - r-data.table
    - r-RhpcBLASctl
    - r-progressr
    - r-future
    - r-future.apply
    - r-qs
    - r-bedtoolsr
    - r-r.utils
    - r-digest
    - r-viridis
    - r-viridisLite
    - bioconductor-bsgenome
    - bioconductor-genomicranges
    - bioconductor-genomeinfodb
    - bioconductor-rsamtools
    - bioconductor-bsgenome.hsapiens.1000genomes.hs37d5
    - bioconductor-bsgenome.hsapiens.UCSC.hg38
    - bioconductor-bsgenome.mmusculus.UCSC.mm10
    - bioconductor-bsgenome.mmulatta.UCSC.rheMac10
    - bioconductor-bsgenome.ptroglodytes.UCSC.panTro6
    - bioconductor-bsgenome.mfuro.UCSC.musFur1

test:
  commands:
    - $R -e "library('scan2.zoo')"           # [not win]
    - "\"%R%\" -e \"library('scan2.zoo')\""  # [win]

about:
  home: https://github.com/emrecaglayan/r-scan2.zoo
  summary: R objects for interactive single cell SNV and indel genotyping
